<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasaHunter PRO</title>
    <style>
        body {
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #00d2ff; }
        .btn-extraer {
            background-color: #00e676;
            color: #1e1e2f;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            transition: 0.3s;
        }
        .btn-extraer:hover { background-color: #00c853; transform: scale(1.05); }
        .badge {
            background: #39395f;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 30px;
            display: inline-block;
            color: #b0b0d0;
        }
        .resultados {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 600px;
            margin: 0 auto;
        }
        .tarjeta {
            background-color: #2a2a40;
            width: 100%;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: left;
            border-left: 5px solid #00d2ff;
            box-sizing: border-box;
        }
        .tarjeta img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #1e1e2f; /* Por si la imagen tarda en cargar */
        }
        .titulo-piso {
            font-size: 1.2em;
            margin: 0 0 10px 0;
            color: #fff;
            line-height: 1.4;
        }
        .precio {
            font-size: 1.5em;
            color: #00e676;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-contacto {
            display: block;
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            transition: 0.3s;
        }
        .btn-contacto:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>⚡ CasaHunter PRO (Teruel & C. Valenciana)</h1>
    
    <!-- Botón para ejecutar el bot de Python -->
    <form method="POST">
        <button type="submit" class="btn-extraer">🚀 Extraer Pisos en Tiempo Real</button>
    </form>

    <!-- Aquí se inyectan los resultados que Python manda a HTML -->
    {% if pisos %}
        <div class="badge">✅ {{ pisos|length }} Ofertas Encontradas en Tiempo Real</div>
        
        <div class="resultados">
            {% for piso in pisos %}
            <div class="tarjeta">
                
                <!-- FOTO DE LA CASA (Lo que pedía el cliente) -->
                {% if piso.imagen %}
                    <img src="{{ piso.imagen }}" alt="Foto del inmueble">
                {% endif %}
                
                <h2 class="titulo-piso">{{ piso.titulo }}</h2>
                <div class="precio">💰 {{ piso.precio }}</div>
                
                <!-- BOTÓN DE CONTACTO (Abre la web para ver el teléfono seguro) -->
                <a href="{{ piso.enlace }}" class="btn-contacto" target="_blank">
                    📞 Ver Teléfono y Galería Completa
                </a>
            </div>
            {% endfor %}
        </div>
    {% endif %}

</body>
</html>
