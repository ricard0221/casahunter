
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - CasaHunter</title>
    <style>
        body { background-color: #1e1e2f; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .contenedor { max-width: 800px; margin: 0 auto; background-color: #2a2a40; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00d2ff; font-size: 1.8em; }
        .precio { font-size: 2em; color: #00e676; font-weight: bold; margin-bottom: 20px; }
        .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .galeria img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 2px solid #39395f; }
        .descripcion { background: #1e1e2f; padding: 20px; border-radius: 8px; line-height: 1.6; margin-bottom: 30px; white-space: pre-line; }
        .btn-llamar { display: block; background-color: #007bff; color: white; padding: 18px; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; font-size: 1.2em; transition: 0.3s; }
        .btn-llamar:hover { background-color: #0056b3; }
        .btn-volver { display: inline-block; color: #b0b0d0; text-decoration: none; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="contenedor">
        <a href="/" class="btn-volver">⬅ Volver al listado</a>
        
        <h1>{{ titulo }}</h1>
        <div class="precio">💰 {{ precio }}</div>
        
        <div class="galeria">
            {% for img in imagenes %}
                <img src="{{ img }}" alt="Foto de la propiedad">
            {% endfor %}
        </div>
        
        <h3>Detalles de la propiedad</h3>
        <div class="descripcion">
            {{ descripcion }}
        </div>
        
        <a href="{{ enlace_original }}" class="btn-llamar" target="_blank">
            📞 Contactar / Ver Teléfono del Anunciante
        </a>
    </div>
</body>
</html>
